name: Capstone analytics quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run data validation unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate validated analytics dashboard
        run: python -m src.app --input data/synthetic_sessions.csv --output output/dashboard.html
      - name: Build Docker image
        run: docker build --tag capstone-analytics-demo:ci .
      - name: Run Dockerized data checks
        run: docker run --rm capstone-analytics-demo:ci
      - name: Save dashboard report
        uses: actions/upload-artifact@v4
        with:
          name: capstone-analytics-dashboard
          path: output/dashboard.html
